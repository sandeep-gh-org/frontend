name: frontend sync to backend

on:
  push:
    branches:
      - main

env:
  BACKEND_REPO: backend
  DESTINATION_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.BACKEND_REPO }}
          token: ${{ secrets.DEST_REPO_PAT }}
          path: destination

      - name: Sync source to backend on a branch
        working-directory: backend
        run: |
          BRANCH_NAME="sync-source-${GITHUB_SHA::7}"
          git checkout -B "$BRANCH_NAME"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            ../source/ ./

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "sync: mirror source ${{ github.sha }}"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Create pull request in backend repo
        env:
          GH_TOKEN: ${{ secrets.BACK_REPO_PAT }}
        run: |
          if ! gh pr view --repo "${{ github.repository_owner }}/${{ env.BACKEND_REPO }}" "$BRANCH_NAME" >/dev/null 2>&1; then
            gh pr create \
              --repo "${{ github.repository_owner }}/${{ env.BACKEND_REPO }}" \
              --base "${{ env.BACKEND_BRANCH }}" \
              --head "$BRANCH_NAME" \
              --title "Sync from source" \
              --body "Automated sync from the source repository"
          else
            echo "PR for branch $BRANCH_NAME already exists."
          fi
